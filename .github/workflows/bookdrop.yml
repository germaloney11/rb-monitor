name: Check Red Books Book Drop

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (safest frequent setting)
  workflow_dispatch:         # allows manual run from Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit the state file

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checker
        run: python check_bookdrop.py

      - name: Commit state (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add last_seen.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last seen Book Drop" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
