name: Red Books Monitor

on:
  schedule:
    # Every 5 minutes from 12:00–16:00 UTC ≈ 5:30 pm – 9:30 pm IST
    - cron: '*/5 12-15 * * *'
    # Extra wider window every 10 minutes
    - cron: '*/10 11-16 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install urlwatch
        run: pip install urlwatch

      - name: Prepare and verify config
        run: |
          echo "=== Files in repo ==="
          ls -la
          echo ""
          mkdir -p $HOME/.config/urlwatch
          mkdir -p $HOME/.cache/urlwatch
          cp -v urls.yaml $HOME/.config/urlwatch/urls.yaml
          cp -v urlwatch.yaml $HOME/.config/urlwatch/urlwatch.yaml
          echo ""
          echo "=== Config directory ==="
          ls -la $HOME/.config/urlwatch/
          echo ""
          echo "=== urls.yaml ==="
          cat $HOME/.config/urlwatch/urls.yaml
          echo ""
          echo "=== urlwatch.yaml ==="
          cat $HOME/.config/urlwatch/urlwatch.yaml

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: \~/.cache/urlwatch
          key: urlwatch-cache-${{ github.run_id }}
          restore-keys: |
            urlwatch-cache-

      - name: Run urlwatch
        run: |
          urlwatch \
            --urls $HOME/.config/urlwatch/urls.yaml \
            --config $HOME/.config/urlwatch/urlwatch.yaml \
            --cache $HOME/.cache/urlwatch/cache.db

      - name: Save cache
        if: always()
        uses: actions/cache@v4
        with:
          path: \~/.cache/urlwatch
          key: urlwatch-cache-${{ github.run_id }}
