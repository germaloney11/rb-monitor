name: Red Books BOOK DROP Monitor

on:
  schedule:
    - cron: '*/5 17-21 * * *'
      timezone: 'Europe/Dublin'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-books-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Check Facebook for latest post
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "ERROR: NTFY_TOPIC GitHub secret is not configured."
            exit 1
          fi

          cat > monitor.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const endpoints = [
            'https://www.facebook.com/redbooksire/posts',
            'https://www.facebook.com/redbooksire/posts/',
            'https://www.facebook.com/redbooksire'
          ];

          const stateFile = 'redbooks-state.json';

          let state = {
            lastPostUrl: null
          };

          if (fs.existsSync(stateFile)) {
            try {
              state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            } catch {
              console.log('Could not read existing state. Starting fresh.');
            }
          }

          async function getLatestPost(page, endpoint) {
            console.log('');
            console.log('==============================================');
            console.log('Trying:', endpoint);
            console.log('==============================================');

            try {
              const response = await page.goto(endpoint, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });

              console.log(
                'HTTP:',
                response ? response.status() : 'no response'
              );

              await page.waitForTimeout(8000);

              console.log('Final URL:', page.url());
              console.log('Title:', await page.title());

              // Look specifically for Facebook post permalinks.
              const posts = await page.locator(
                'a[href*="/posts/"][href*="pfbid"], ' +
                'a[href*="/permalink.php"], ' +
                'a[href*="/story.php"]'
              ).evaluateAll(links =>
                links.map(a => ({
                  href: a.href,
                  text: (a.innerText || '').trim()
                }))
              );

              console.log('Post links found:', posts.length);

              if (posts.length === 0) {
                return null;
              }

              // Remove duplicates while preserving Facebook's page order.
              const unique = [];
              const seen = new Set();

              for (const post of posts) {
                if (!seen.has(post.href)) {
                  seen.add(post.href);
                  unique.push(post);
                }
              }

              console.log('Unique post links:', unique.length);

              // The first post permalink is our best candidate for newest.
              const latestUrl = unique[0].href;

              console.log('Candidate latest post:');
              console.log(latestUrl);

              // Find the article containing that permalink.
              const article = page.locator('div[role="article"]').filter({
                has: page.locator(`a[href="${latestUrl}"]`)
              }).first();

              let text = '';

              if (await article.count()) {
                text = await article.innerText();
              }

              // Fallback: use nearby page text if the article selector
              // isn't available.
              if (!text) {
                text = await page.locator('body').innerText();
              }

              console.log('');
              console.log('========== LATEST POST TEXT ==========');
              console.log(text.substring(0, 10000));
              console.log('========== END POST TEXT ==========');

              return {
                url: latestUrl,
                text: text
              };

            } catch (error) {
              console.log('Endpoint failed:', error.message);
              return null;
            }
          }

          async function sendNtfy(title, message, clickUrl) {
            console.log('');
            console.log('Sending ntfy notification...');

            const response = await fetch(
              `https://ntfy.sh/${process.env.NTFY_TOPIC}`,
              {
                method: 'POST',
                headers: {
                  'Title': title,
                  'Priority': 'high',
                  'Tags': 'books',
                  ...(clickUrl ? { 'Click': clickUrl } : {})
                },
                body: message
              }
            );

            console.log('ntfy HTTP:', response.status);

            if (!response.ok) {
              throw new Error(
                `ntfy returned HTTP ${response.status}: ${await response.text()}`
              );
            }

            console.log('Notification sent successfully.');
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              viewport: {
                width: 1280,
                height: 1000
              },
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
                '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
            });

            const page = await context.newPage();

            let latest = null;
            let workingEndpoint = null;

            for (const endpoint of endpoints) {
              latest = await getLatestPost(page, endpoint);

              if (latest && latest.url) {
                workingEndpoint = endpoint;
                break;
              }
            }

            if (!latest) {
              console.log('');
              console.log('==============================================');
              console.log('NO FACEBOOK POST FOUND');
              console.log('==============================================');

              await browser.close();

              // Do NOT change state if Facebook failed.
              process.exit(0);
            }

            console.log('');
            console.log('Working endpoint:', workingEndpoint);
            console.log('Latest post URL:', latest.url);

            const textLower = latest.text.toLowerCase();

            const isBookDrop =
              textLower.includes('book drop');

            console.log('BOOK DROP:', isBookDrop ? 'YES
