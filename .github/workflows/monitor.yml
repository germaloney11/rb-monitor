name: Test Red Books Scrolling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test Facebook scrolling
        run: |
          cat > test_facebook.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          import time

          URL = "https://www.facebook.com/redbooksire"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage"
                  ]
              )

              context = browser.new_context(
                  viewport={"width": 1280, "height": 900},
                  locale="en-IE",
                  timezone_id="Europe/Dublin",
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/140.0.0.0 Safari/537.36"
                  )
              )

              page = context.new_page()

              print("=" * 70)
              print("OPENING FACEBOOK")
              print("=" * 70)

              response = page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print("HTTP status:", response.status if response else "NONE")
              print("Final URL:", page.url)
              print("Title:", page.title())

              time.sleep(5)

              # ---------------------------------------------------------
              # Scroll repeatedly so Facebook has a chance to lazy-load
              # additional posts.
              # ---------------------------------------------------------

              print()
              print("=" * 70)
              print("SCROLLING")
              print("=" * 70)

              previous_height = 0

              for i in range(1, 16):

                  print(f"Scroll {i}/15")

                  page.evaluate("""
                      window.scrollTo({
                          top: document.body.scrollHeight,
                          behavior: 'instant'
                      });
                  """)

                  time.sleep(3)

                  height = page.evaluate(
                      "document.body.scrollHeight"
                  )

                  print("Page height:", height)

                  if height == previous_height:
                      print("Page height did not increase.")
                  else:
                      print("More page content detected.")

                  previous_height = height

              # Scroll back to top once finished.
              page.evaluate("window.scrollTo(0, 0)")
              time.sleep(2)

              # ---------------------------------------------------------
              # Get all visible page text.
              # ---------------------------------------------------------

              text = page.locator("body").inner_text(timeout=30000)

              print()
              print("=" * 70)
              print("TEXT SUMMARY")
              print("=" * 70)

              print("Characters:", len(text))
              print("BOOK occurrences:", len(
                  re.findall(r"book", text, re.IGNORECASE)
              ))

              # Print the entire text up to 50,000 characters.
              print()
              print(text[:50000])

              # ---------------------------------------------------------
              # Search specifically for BOOK DROP.
              # ---------------------------------------------------------

              print()
              print("=" * 70)
              print("BOOK DROP SEARCH")
              print("=" * 70)

              matches = re.findall(
                  r".{0,500}book\s*[-–—]?\s*drop.{0,1000}",
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              if matches:
                  print("FOUND BOOK DROP!")
                  print("Matches:", len(matches))

                  for i, match in enumerate(matches[:20], 1):
                      print()
                      print(f"--- MATCH {i} ---")
                      print(match)
              else:
                  print("NO BOOK DROP TEXT FOUND.")

              # ---------------------------------------------------------
              # Look for Facebook post links.
              # ---------------------------------------------------------

              print()
              print("=" * 70)
              print("FACEBOOK LINKS")
              print("=" * 70)

              links = page.locator("a").all()

              found_links = set()

              for link in links:
                  try:
                      href = link.get_attribute("href")
                      if href and (
                          "/posts/" in href
                          or "/permalink/" in href
                          or "story_fbid=" in href
                      ):
                          found_links.add(href)
                  except Exception:
                      pass

              print("Post-like links found:", len(found_links))

              for href in sorted(found_links):
                  print(href)

              # ---------------------------------------------------------
              # Screenshot after scrolling.
              # ---------------------------------------------------------

              print()
              print("=" * 70)
              print("SAVING SCREENSHOT")
              print("=" * 70)

              page.screenshot(
                  path="facebook-scrolled.png",
                  full_page=True
              )

              browser.close()
          PY

          python test_facebook.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-scrolled-screenshot
          path: facebook-scrolled.png
          if-no-files-found: ignore
