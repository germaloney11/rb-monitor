# More flexible BOOK DROP detection - 25 Sep 2026
name: Red Books BOOK DROP Monitor

on:
  schedule:
    - cron: '*/5 17-21 * * *'
      timezone: 'Europe/Dublin'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-books-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Check Red Books
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "ERROR: NTFY_TOPIC secret is missing."
            exit 1
          fi

          cat > monitor.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const ENDPOINTS = [
            'https://www.facebook.com/redbooksire/posts',
            'https://www.facebook.com/redbooksire',
            'https://m.facebook.com/redbooksire',
            'https://mbasic.facebook.com/redbooksire'
          ];

          const STATE_FILE = 'redbooks-state.json';

          let state = { lastPostId: null };
          if (fs.existsSync(STATE_FILE)) {
            try {
              state = JSON.parse(fs.readFileSync(STATE_FILE, 'utf8'));
            } catch (e) {
              console.log('Could not read existing state.');
            }
          }

          function extractPostId(url) {
            if (!url) return null;
            const match = url.match(/\/posts\/(pfbid[^/?#]+)/i) ||
                          url.match(/story_fbid=([^&]+)/i) ||
                          url.match(/\/permalink\.php\?story_fbid=([^&]+)/i);
            return match ? match[1] : url;
          }

          async function sendNotification(postText, postUrl) {
            const response = await fetch(`https://ntfy.sh/${process.env.NTFY_TOPIC}`, {
              method: 'POST',
              headers: {
                'Title': 'BOOK DROP!',
                'Priority': 'max',
                'Tags': 'books',
                'Click': postUrl
              },
              body: 'New BOOK DROP posted by Red Books Ireland.\n\n' + postText.substring(0, 1000)
            });
            console.log('ntfy response:', response.status);
            if (!response.ok) throw new Error('ntfy failed: ' + await response.text());
            console.log('NTFY notification sent.');
          }

          async function checkEndpoint(page, endpoint) {
            console.log('\n==========================================');
            console.log('Checking:', endpoint);
            console.log('==========================================');

            try {
              const response = await page.goto(endpoint, {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });

              console.log('HTTP:', response ? response.status() : 'unknown');
              console.log('Final URL:', page.url());
              console.log('Title:', await page.title());

              await page.waitForTimeout(3000);
              await page.evaluate(() => window.scrollBy(0, 1500));
              await page.waitForTimeout(2000);
              await page.evaluate(() => window.scrollBy(0, 1500));
              await page.waitForTimeout(2000);

              const bodyText = await page.locator('body').innerText();
              if (/log in|sign up|create new account|you must log in/i.test(bodyText.substring(0, 2000))) {
                console.log('WARNING: Possible login wall detected.');
              }

              console.log('Page text length:', bodyText.length);

              const postSelectors = [
                'div[role="article"]',
                'div[data-pagelet*="FeedUnit"]',
                'div.userContentWrapper',
                'div[data-ft]',
                'article'
              ];

              let articles = null;
              for (const sel of postSelectors) {
                const count = await page.locator(sel).count();
                console.log(`Selector "${sel}": ${count} found`);
                if (count > 0) {
                  articles = page.locator(sel);
                  break;
                }
              }

              if (!articles || await articles.count() === 0) {
                console.log('No articles found with any selector.');
                const links = await page.locator('a[href*="/posts/"], a[href*="story_fbid"], a[href*="permalink"]').all();
                console.log('Post-like links found:', links.length);
                if (links.length === 0) return null;
              }

              const firstArticle = articles ? articles.first() : null;
              let postText = '';
              let postUrl = page.url();
              let postId = null;

              if (firstArticle) {
                const link = firstArticle.locator('a[href*="/posts/"], a[href*="story_fbid"], a[href*="permalink"]').first();
                if (await link.count()) {
                  postUrl = await link.getAttribute('href');
                  if (postUrl && !postUrl.startsWith('http')) {
                    postUrl = 'https://www.facebook.com' + postUrl;
                  }
                  postId = extractPostId(postUrl);
                }

                const messageSelectors = [
                  'div[data-ad-preview="message"]',
                  'div[data-ad-comet-preview="message"]',
                  'div[dir="auto"]'
                ];

                for (const sel of messageSelectors) {
                  const el = firstArticle.locator(sel).first();
                  if (await el.count()) {
                    postText = await el.innerText();
                    if (postText && postText.length > 10) break;
                  }
                }

                if (!postText) {
                  postText = await firstArticle.innerText();
                }
              }

              if (!postText || postText.length < 10) {
                postText = bodyText.substring(0, 3000);
              }

              console.log('\n========== LATEST POST ==========');
              console.log(postText.substring(0, 1500));
              console.log('========== END POST ==========');
              console.log('Post ID:', postId);
              console.log('Post URL:', postUrl);

              return {
                id: postId || 'unknown-' + Date.now(),
                url: postUrl,
                text: postText
              };

            } catch (error) {
              console.log('Endpoint error:', error.message);
              return null;
            }
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--disable-blink-features=AutomationControlled']
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 900 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              locale: 'en-IE'
            });

            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
            });

            const page = await context.newPage();
            let latest = null;

            for (const endpoint of ENDPOINTS) {
              latest = await checkEndpoint(page, endpoint);
              if (latest && latest.text && latest.id && !latest.id.startsWith('unknown-')) {
                console.log('Working endpoint:', endpoint);
                break;
              }
            }

            if (!latest || !latest.text) {
              console.log('\nNO POST COULD BE RETRIEVED.');
              await browser.close();
              process.exit(0);
            }

            // More flexible match - works even with emoji or punctuation stuck to the words
            const isBookDrop = /book\s*drop/i.test(latest.text);
            console.log('\nBOOK DROP detected:', isBookDrop ? 'YES' : 'NO');
            console.log('Previous post ID:', state.lastPostId);
            console.log('Current post ID:', latest.id);

            if (!state.lastPostId) {
              console.log('FIRST RUN - saving state without notification.');
              state.lastPostId = latest.id;
              fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
              await browser.close();
              process.exit(0);
            }

            if (latest.id === state.lastPostId) {
              console.log('Same post as last check. No notification needed.');
              await browser.close();
              process.exit(0);
            }

            console.log('\n===== NEW POST DETECTED =====');
            state.lastPostId = latest.id;
            fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));

            if (isBookDrop) {
              await sendNotification(latest.text, latest.url);
            } else {
              console.log('New post is not a BOOK DROP.');
            }

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node monitor.js

      - name: Save monitor state
        if: always()
        run: |
          if [ -f redbooks-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add redbooks-state.json
            if git diff --cached --quiet; then
              echo "No state changes."
            else
              git commit -m "Update Red Books monitor state"
              git push
            fi
          else
            echo "No state file."
          fi
