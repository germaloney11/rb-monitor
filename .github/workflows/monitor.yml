# Red Books BOOK DROP Monitor - multi-article + no null overwrite - 8 Oct 2026
name: Red Books BOOK DROP Monitor

on:
  schedule:
    - cron: '*/5 17-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-books-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v2

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Check Red Books
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "ERROR: NTFY_TOPIC secret is missing."
            exit 1
          fi

          cat > monitor.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const crypto = require('crypto');

          const ENDPOINTS = [
            'https://www.facebook.com/redbooksire/posts',
            'https://www.facebook.com/redbooksire',
            'https://m.facebook.com/redbooksire',
            'https://mbasic.facebook.com/redbooksire'
          ];

          const STATE_FILE = 'redbooks-state.json';

          let state = {
            lastPostId: null,
            lastBookDropId: null,
            lastBookDropFingerprint: null,
            seenBookDropIds: []
          };

          if (fs.existsSync(STATE_FILE)) {
            try {
              const loaded = JSON.parse(fs.readFileSync(STATE_FILE, 'utf8'));
              state = { ...state, ...loaded };
              if (!Array.isArray(state.seenBookDropIds)) state.seenBookDropIds = [];
            } catch (e) {
              console.log('Could not read existing state.');
            }
          }

          function extractPostId(url) {
            if (!url) return null;
            const match = url.match(/\/posts\/(pfbid[^/?#]+)/i) ||
                          url.match(/story_fbid=([^&]+)/i) ||
                          url.match(/\/permalink\.php\?story_fbid=([^&]+)/i);
            return match ? match[1] : null;
          }

          function bookDropFingerprint(text) {
            if (!text) return null;
            const lines = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
            let line = lines.find(s => /book\s*drop/i.test(s)) || lines[0] || text.substring(0, 120);
            line = line.toUpperCase().replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
            const normalizedFull = text
              .toUpperCase()
              .replace(/[^\w\s]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim()
              .substring(0, 300);
            const hash = crypto.createHash('sha256').update(normalizedFull).digest('hex').substring(0, 16);
            return line + '|' + hash;
          }

          async function sendNotification(postText, postUrl) {
            const response = await fetch(`https://ntfy.sh/${process.env.NTFY_TOPIC}`, {
              method: 'POST',
              headers: {
                'Title': 'BOOK DROP!',
                'Priority': 'max',
                'Tags': 'books',
                'Click': postUrl || 'https://www.facebook.com/redbooksire'
              },
              body: 'New BOOK DROP posted by Red Books Ireland.\n\n' + postText.substring(0, 1000)
            });
            console.log('ntfy response:', response.status);
            if (!response.ok) throw new Error('ntfy failed: ' + await response.text());
            console.log('NTFY notification sent.');
          }

          async function extractArticles(page) {
            const postSelectors = [
              'div[role="article"]',
              'div[data-pagelet*="FeedUnit"]',
              'div.userContentWrapper',
              'div[data-ft]',
              'article'
            ];

            let articles = null;
            for (const sel of postSelectors) {
              const count = await page.locator(sel).count();
              console.log(`Selector "${sel}": ${count} found`);
              if (count > 0) {
                articles = page.locator(sel);
                break;
              }
            }
            if (!articles) return [];

            const total = Math.min(await articles.count(), 8);
            const results = [];

            for (let i = 0; i < total; i++) {
              const article = articles.nth(i);
              let postText = '';
              let postUrl = null;
              let postId = null;

              try {
                const link = article.locator('a[href*="/posts/"], a[href*="story_fbid"], a[href*="permalink"]').first();
                if (await link.count()) {
                  postUrl = await link.getAttribute('href');
                  if (postUrl && !postUrl.startsWith('http')) {
                    postUrl = 'https://www.facebook.com' + postUrl;
                  }
                  postId = extractPostId(postUrl);
                }

                const messageSelectors = [
                  'div[data-ad-preview="message"]',
                  'div[data-ad-comet-preview="message"]',
                  'div[dir="auto"]'
                ];
                for (const sel of messageSelectors) {
                  const el = article.locator(sel).first();
                  if (await el.count()) {
                    const t = await el.innerText();
                    if (t && t.length > 10) {
                      postText = t;
                      break;
                    }
                  }
                }
                if (!postText) {
                  postText = await article.innerText();
                }
              } catch (e) {
                console.log('Article', i, 'extract error:', e.message);
                continue;
              }

              if (postText && postText.length > 5) {
                results.push({
                  id: postId || ('unknown-' + i + '-' + Date.now()),
                  url: postUrl || page.url(),
                  text: postText
                });
              }
            }
            return results;
          }

          async function checkEndpoint(page, endpoint) {
            console.log('\n==========================================');
            console.log('Checking:', endpoint);
            console.log('==========================================');

            try {
              const response = await page.goto(endpoint, {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });

              console.log('HTTP:', response ? response.status() : 'unknown');
              console.log('Final URL:', page.url());
              console.log('Title:', await page.title());

              await page.waitForTimeout(4000);
              await page.evaluate(() => window.scrollBy(0, 2000));
              await page.waitForTimeout(2500);
              await page.evaluate(() => window.scrollBy(0, 2000));
              await page.waitForTimeout(2500);

              const bodyText = await page.locator('body').innerText();
              const loginWall = /log in|sign up|create new account|you must log in/i.test(bodyText.substring(0, 2000));
              if (loginWall) {
                console.log('WARNING: Possible login wall detected.');
                await page.evaluate(() => window.scrollBy(0, 2500));
                await page.waitForTimeout(3000);
              }

              console.log('Page text length:', bodyText.length);

              const articles = await extractArticles(page);
              console.log('Articles extracted:', articles.length);

              if (articles.length === 0) {
                console.log('No articles found.');
                return null;
              }

              const bookDropArticle = articles.find(a => /book\s*drop/i.test(a.text));
              const chosen = bookDropArticle || articles[0];

              console.log('\n========== CHOSEN POST ==========');
              console.log(chosen.text.substring(0, 1500));
              console.log('========== END POST ==========');
              console.log('Post ID:', chosen.id);
              console.log('Post URL:', chosen.url);
              console.log('Is BOOK DROP among articles:', !!bookDropArticle);

              return chosen;
            } catch (error) {
              console.log('Endpoint error:', error.message);
              return null;
            }
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--disable-blink-features=AutomationControlled']
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 900 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              locale: 'en-IE'
            });

            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
            });

            const page = await context.newPage();
            let latest = null;

            for (const endpoint of ENDPOINTS) {
              const result = await checkEndpoint(page, endpoint);
              if (result && result.text && result.id && !String(result.id).startsWith('unknown-')) {
                if (/book\s*drop/i.test(result.text)) {
                  latest = result;
                  console.log('Working endpoint (BOOK DROP found):', endpoint);
                  break;
                }
                // Keep first valid post; do NOT let later failures clear it
                if (!latest) {
                  latest = result;
                  console.log('Working endpoint (no BOOK DROP yet):', endpoint);
                } else {
                  console.log('Endpoint ok but keeping earlier result:', endpoint);
                }
              }
            }

            if (!latest || !latest.text) {
              console.log('\nNO POST COULD BE RETRIEVED.');
              await browser.close();
              process.exit(0);
            }

            const isBookDrop = /book\s*drop/i.test(latest.text);
            const fingerprint = isBookDrop ? bookDropFingerprint(latest.text) : null;

            console.log('\nBOOK DROP detected:', isBookDrop ? 'YES' : 'NO');
            console.log('Previous post ID:', state.lastPostId);
            console.log('Previous BOOK DROP ID:', state.lastBookDropId);
            console.log('Previous BOOK DROP fingerprint:', state.lastBookDropFingerprint);
            console.log('Current post ID:', latest.id);
            console.log('Current fingerprint:', fingerprint);

            state.lastPostId = latest.id;

            if (!state.lastBookDropId && !state.lastBookDropFingerprint && state.seenBookDropIds.length === 0) {
              console.log('FIRST RUN - saving state without notification.');
              if (isBookDrop) {
                state.lastBookDropId = latest.id;
                state.lastBookDropFingerprint = fingerprint;
                state.seenBookDropIds = [latest.id];
              }
              fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
              await browser.close();
              process.exit(0);
            }

            if (isBookDrop) {
              const idSeen = state.seenBookDropIds.includes(latest.id) || latest.id === state.lastBookDropId;
              const sameContent = fingerprint && fingerprint === state.lastBookDropFingerprint;

              if (idSeen || sameContent) {
                console.log('Same BOOK DROP as before (id or content match). No notification.');
                if (!state.seenBookDropIds.includes(latest.id)) {
                  state.seenBookDropIds.push(latest.id);
                  state.seenBookDropIds = state.seenBookDropIds.slice(-30);
                }
                if (!state.lastBookDropFingerprint) state.lastBookDropFingerprint = fingerprint;
                fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
              } else {
                console.log('\n===== NEW BOOK DROP DETECTED =====');
                state.lastBookDropId = latest.id;
                state.lastBookDropFingerprint = fingerprint;
                state.seenBookDropIds.push(latest.id);
                state.seenBookDropIds = state.seenBookDropIds.slice(-30);
                fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
                await sendNotification(latest.text, latest.url);
              }
            } else {
              console.log('Post is not a BOOK DROP. State updated (lastPostId only).');
              fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
            }

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node monitor.js

      - name: Save monitor state
        if: always()
        run: |
          if [ -f redbooks-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add redbooks-state.json
            if git diff --cached --quiet; then
              echo "No state changes."
            else
              git commit -m "Update Red Books monitor state" || true
              git pull --rebase origin main || git pull --rebase --autostash origin main || true
              git push origin main || echo "Push failed after retry; next run will catch up."
            fi
          else
            echo "No state file."
          fi
