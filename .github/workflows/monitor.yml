name: Test Facebook Posts Page

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Test Facebook Posts
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 1000 },
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'
            });

            const url = 'https://www.facebook.com/redbooksire/posts';

            console.log('Opening:', url);

            const response = await page.goto(url, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log('HTTP status:', response ? response.status() : 'none');

            await page.waitForTimeout(10000);

            console.log('Final URL:', page.url());
            console.log('Title:', await page.title());

            const text = await page.locator('body').innerText();

            console.log('========== PAGE TEXT ==========');
            console.log(text.substring(0, 30000));
            console.log('========== END PAGE TEXT ==========');

            const links = await page.locator('a').evaluateAll(links =>
              links.map(a => ({
                text: (a.innerText || '').trim(),
                href: a.href
              })).filter(x => x.href)
            );

            console.log('========== POST LINKS ==========');

            for (const link of links) {
              if (
                link.href.includes('/posts/') ||
                link.href.includes('story.php') ||
                link.href.includes('permalink.php')
              ) {
                console.log(JSON.stringify(link));
              }
            }

            console.log('========== BOOK DROP SEARCH ==========');

            const lower = text.toLowerCase();

            if (lower.includes('book drop')) {
              console.log('*** BOOK DROP FOUND ***');
            } else {
              console.log('No BOOK DROP found.');
            }

            await page.screenshot({
              path: 'facebook-posts.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-posts-test
          path: facebook-posts.png
          if-no-files-found: ignore
