name: Red Books Facebook Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Test Facebook
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          const endpoints = [
            'https://www.facebook.com/redbooksire/posts',
            'https://www.facebook.com/redbooksire/posts/',
            'https://www.facebook.com/redbooksire'
          ];

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1280,
                height: 1000
              },
              userAgent:
                'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
                '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
            });

            for (const endpoint of endpoints) {
              console.log('');
              console.log('========================================');
              console.log('TESTING: ' + endpoint);
              console.log('========================================');

              try {
                const response = await page.goto(endpoint, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });

                console.log(
                  'HTTP STATUS: ' +
                  (response ? response.status() : 'none')
                );

                await page.waitForTimeout(8000);

                console.log('FINAL URL: ' + page.url());
                console.log('TITLE: ' + await page.title());

                const posts = await page.locator(
                  'a[href*="/posts/"][href*="pfbid"], ' +
                  'a[href*="/permalink.php"], ' +
                  'a[href*="/story.php"]'
                ).evaluateAll(links =>
                  links.map(a => ({
                    href: a.href,
                    text: (a.innerText || '').trim()
                  }))
                );

                const unique = [];
                const seen = new Set();

                for (const post of posts) {
                  if (!seen.has(post.href)) {
                    seen.add(post.href);
                    unique.push(post);
                  }
                }

                console.log('POST LINKS FOUND: ' + unique.length);

                if (unique.length > 0) {
                  console.log('');
                  console.log('LATEST POST URL:');
                  console.log(unique[0].href);

                  console.log('');
                  console.log('POST LINK TEXT:');
                  console.log(unique[0].text);

                  const article = page.locator(
                    'div[role="article"]'
                  ).filter({
                    has: page.locator(
                      'a[href="' + unique[0].href + '"]'
                    )
                  }).first();

                  let text = '';

                  if (await article.count()) {
                    text = await article.innerText();
                  }

                  if (!text) {
                    text = await page.locator('body').innerText();
                  }

                  console.log('');
                  console.log('========== LATEST POST TEXT ==========');
                  console.log(text.substring(0, 5000));
                  console.log('========== END POST TEXT ==========');

                  console.log('');
                  console.log(
                    'BOOK DROP FOUND: ' +
                    (text.toLowerCase().includes('book drop')
                      ? 'YES'
                      : 'NO')
                  );
                }

              } catch (error) {
                console.log('ERROR: ' + error.message);
              }
            }

            await browser.close();
          })();
          EOF

          node test.js
