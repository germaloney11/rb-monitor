name: Test Red Books Facebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test Facebook page
        run: |
          cat > test_facebook.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          import time

          URL = "https://www.facebook.com/redbooksire"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage"
                  ]
              )

              context = browser.new_context(
                  viewport={"width": 1280, "height": 900},
                  locale="en-IE",
                  timezone_id="Europe/Dublin",
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/140.0.0.0 Safari/537.36"
                  )
              )

              page = context.new_page()

              print("=" * 60)
              print("Opening Facebook page")
              print("=" * 60)

              response = page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print("HTTP status:", response.status if response else "NONE")
              print("Final URL:", page.url)
              print("Title:", page.title())

              # Give Facebook's JavaScript time to populate the page.
              time.sleep(8)

              print("=" * 60)
              print("PAGE TEXT")
              print("=" * 60)

              text = page.locator("body").inner_text(timeout=30000)

              # Print only the first 20,000 characters so the Actions log
              # doesn't become unnecessarily huge.
              print(text[:20000])

              print("=" * 60)
              print("BOOK DROP SEARCH")
              print("=" * 60)

              matches = re.findall(
                  r".{0,300}book\s*[-–—]?\s*drop.{0,500}",
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              if matches:
                  print("FOUND BOOK DROP!")
                  print("Number of matches:", len(matches))

                  for i, match in enumerate(matches[:10], 1):
                      print()
                      print(f"--- MATCH {i} ---")
                      print(match)
              else:
                  print("NO BOOK DROP TEXT FOUND.")

              print("=" * 60)
              print("SCREENSHOT")
              print("=" * 60)

              page.screenshot(
                  path="facebook-page.png",
                  full_page=True
              )

              browser.close()
          PY

          python test_facebook.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-page-screenshot
          path: facebook-page.png
          if-no-files-found: ignore
