name: Red Books Monitor

on:
  schedule:
    # Runs every 5 minutes between 12:30–15:30 UTC
    # = 6:00–9:00 pm IST (UTC+5:30)
    - cron: '*/5 12-15 * * *'
  workflow_dispatch:   # allows manual testing

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install urlwatch
        run: pip install urlwatch

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: \~/.cache/urlwatch
          key: urlwatch-cache-${{ github.run_id }}
          restore-keys: |
            urlwatch-cache-

      - name: Run urlwatch
        run: |
          mkdir -p \~/.config/urlwatch
          cp urls.yaml \~/.config/urlwatch/
          cp urlwatch.yaml \~/.config/urlwatch/
          urlwatch --cache \~/.cache/urlwatch/cache.db

      - name: Save cache
        if: always()
        uses: actions/cache@v4
        with:
          path: \~/.cache/urlwatch
          key: urlwatch-cache-${{ github.run_id }}
