name: Red Books Monitor

on:
  schedule:
    # Every 5 minutes from 16:00–20:59 UTC = 5:00 pm – 9:59 pm Irish time
    - cron: '*/5 16-20 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install urlwatch
        run: pip install urlwatch

      - name: Prepare config
        run: |
          mkdir -p $HOME/.config/urlwatch
          mkdir -p $HOME/.cache/urlwatch
          cp urls.yaml $HOME/.config/urlwatch/urls.yaml
          cp urlwatch.yaml $HOME/.config/urlwatch/urlwatch.yaml

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: \~/.cache/urlwatch
          key: urlwatch-cache-v1
          restore-keys: |
            urlwatch-cache-

      - name: Run urlwatch
        run: |
          urlwatch \
            --urls $HOME/.config/urlwatch/urls.yaml \
            --config $HOME/.config/urlwatch/urlwatch.yaml \
            --cache $HOME/.cache/urlwatch/cache.db

      - name: Save cache
        if: always()
        uses: actions/cache@v4
        with:
          path: \~/.cache/urlwatch
          key: urlwatch-cache-v1
