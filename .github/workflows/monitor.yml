name: Test Red Books Latest Post

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Read newest Facebook post
        run: |
          cat > test_latest.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          import time

          URL = "https://www.facebook.com/redbooksire"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage"
                  ]
              )

              context = browser.new_context(
                  viewport={"width": 1280, "height": 900},
                  locale="en-IE",
                  timezone_id="Europe/Dublin",
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/140.0.0.0 Safari/537.36"
                  )
              )

              page = context.new_page()

              print("=" * 70)
              print("OPENING RED BOOKS")
              print("=" * 70)

              response = page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print("HTTP status:", response.status if response else "NONE")
              print("Final URL:", page.url)
              print("Title:", page.title())

              time.sleep(8)

              # ---------------------------------------------------------
              # Find links that look like Facebook posts.
              # ---------------------------------------------------------

              print()
              print("=" * 70)
              print("POST LINKS")
              print("=" * 70)

              post_links = []

              for link in page.locator("a").all():
                  try:
                      href = link.get_attribute("href")

                      if not href:
                          continue

                      if (
                          "/posts/" in href
                          or "/permalink/" in href
                          or "story_fbid=" in href
                      ):
                          if href not in post_links:
                              post_links.append(href)

                  except Exception:
                      pass

              print("Post links found:", len(post_links))

              for i, href in enumerate(post_links[:10], 1):
                  print(f"{i}: {href}")

              # ---------------------------------------------------------
              # Inspect the page text.
              # ---------------------------------------------------------

              print()
              print("=" * 70)
              print("PAGE TEXT")
              print("=" * 70)

              text = page.locator("body").inner_text(timeout=30000)

              print(text[:15000])

              # ---------------------------------------------------------
              # Search for BOOK DROP.
              # ---------------------------------------------------------

              print()
              print("=" * 70)
              print("BOOK DROP")
              print("=" * 70)

              match = re.search(
                  r"book\s*[-–—]?\s*drop",
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  print("BOOK DROP FOUND")

                  start = max(0, match.start() - 500)
                  end = min(len(text), match.end() + 1000)

                  print()
                  print(text[start:end])

              else:
                  print("BOOK DROP NOT FOUND")

              # ---------------------------------------------------------
              # Save screenshot.
              # ---------------------------------------------------------

              page.screenshot(
                  path="latest-post.png",
                  full_page=True
              )

              browser.close()
          PY

          python test_latest.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-facebook-post
          path: latest-post.png
          if-no-files-found: ignore
