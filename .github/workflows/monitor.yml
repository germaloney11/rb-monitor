name: Red Books BOOK DROP Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install urlwatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install urlwatch

      - name: Create urlwatch directories
        run: |
          mkdir -p .urlwatch

      - name: Run urlwatch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "ERROR: NTFY_TOPIC GitHub secret is not configured."
            exit 1
          fi

          sed "s|__NTFY_TOPIC__|${NTFY_TOPIC}|g" \
            urlwatch.yaml > .urlwatch/urlwatch.yaml

          export XDG_CONFIG_HOME="$GITHUB_WORKSPACE/.urlwatch"
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.urlwatch/cache"

          mkdir -p "$XDG_CACHE_HOME"

          echo "Running urlwatch..."
          urlwatch \
            --urls "$GITHUB_WORKSPACE/urls.yaml" \
            --config "$XDG_CONFIG_HOME/urlwatch.yaml" \
            --cache "$XDG_CACHE_HOME/cache.db" \
            --verbose

      - name: Show urlwatch cache
        if: always()
        run: |
          echo "=============================================="
          echo "URLWATCH CACHE FILE"
          echo "=============================================="

          if [ -f ".urlwatch/cache/cache.db" ]; then
            ls -lh .urlwatch/cache/cache.db
          else
            echo "Cache file not found."
          fi

      - name: Commit urlwatch history
        if: always()
        run: |
          if [ -f ".urlwatch/cache/cache.db" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f .urlwatch/cache/cache.db

            if git diff --cached --quiet; then
              echo "No urlwatch history changes to commit."
            else
              git commit -m "Update urlwatch history"
              git push
            fi
          else
            echo "No urlwatch cache database found."
          fi
