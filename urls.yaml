# Main (usually most reliable for public posts)
name: Red Books (mbasic)
url: https://mbasic.facebook.com/redbooksire
filter:
  - css: div#objects_container
  - html2text
  - grep: "(?i)BOOK DROP|book drop|NIGHT BOOK DROP|night book drop"
  - strip

